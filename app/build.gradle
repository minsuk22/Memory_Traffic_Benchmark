plugins {
    id 'com.android.application'
}

android {
    namespace 'com.memtraffic.bench'
    compileSdk 34
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.memtraffic.bench'
        minSdk 28            // Vulkan 1.1
        targetSdk 34
        versionCode 16
        versionName '1.15'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DMEMBENCH_JNI=ON', '-DANDROID_STL=c++_static'
            }
        }
    }

    buildTypes {
        // The benchmark is always native-Release; "debug" only differs in APK signing.
        debug {
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path file('../native/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Menu labels are Korean: compile the sources as UTF-8 whatever the host code page is.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
